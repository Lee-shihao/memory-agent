[package]
name = "memory-agent"
version = "0.1.0"
edition = "2021"
description = "CLI Agent with built-in vector memory system"

[[bin]]
name = "memory-agent"
path = "src/main.rs"

[lib]
name = "memory_agent"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rusqlite = { version = "0.31", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
rustyline = "14"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
thiserror = "1"
once_cell = "1"
dirs = "5"
walkdir = "2"

# Vector search: sqlite-vec virtual tables (replaces instant-distance/HNSW)
sqlite-vec = "0.1"
zerocopy = "0.8"

[dev-dependencies]
wiremock = "0.6"
